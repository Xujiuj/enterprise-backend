--- # redis 鍗曟満閰嶇疆(鍗曟満涓庨泦缇ゅ彧鑳藉紑鍚竴涓彟涓€涓渶瑕佹敞閲婃帀)
spring.data:
  redis:
    # 鍦板潃
    host: ${REDIS_HOST:124.221.155.102}
    # 绔彛锛岄粯璁や负6379
    port: 6379
    # 鏁版嵁搴撶储寮?
    database: 0
    # redis 瀵嗙爜蹇呴』閰嶇疆
#    password:
    # 杩炴帴瓒呮椂鏃堕棿
    timeout: 10s
    # 鏄惁寮€鍚痵sl
    ssl.enabled: false

# redisson 閰嶇疆
redisson:
  # redis key鍓嶇紑
  keyPrefix:
  # 绾跨▼姹犳暟閲?
  threads: 4
  # Netty绾跨▼姹犳暟閲?
  nettyThreads: 8
  # 鍗曡妭鐐归厤缃?
  singleServerConfig:
    # 瀹㈡埛绔悕绉?涓嶈兘鐢ㄤ腑鏂?
    clientName: Enterprise-Carbon-Data
    # 鏈€灏忕┖闂茶繛鎺ユ暟
    connectionMinimumIdleSize: 8
    # 杩炴帴姹犲ぇ灏?
    connectionPoolSize: 32
    # 杩炴帴绌洪棽瓒呮椂锛屽崟浣嶏細姣
    idleConnectionTimeout: 10000
    # 鍛戒护绛夊緟瓒呮椂锛屽崟浣嶏細姣
    timeout: 3000
    # 鍙戝竷鍜岃闃呰繛鎺ユ睜澶у皬
    subscriptionConnectionPoolSize: 50

