name: Diagnose enterprise production

on:
  workflow_dispatch:
    inputs:
      since:
        description: "journalctl --since value"
        required: false
        default: "2 hours ago"
      grep:
        description: "extended grep pattern for app logs"
        required: false
        default: "ERROR|Exception|SQLSyntax|BadSqlGrammar|Unknown column|green-power|greenElectricity|greenPowerCertificate|factorConfirmation"

permissions:
  contents: read

jobs:
  diagnose:
    name: Read production diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SERVICE: enterprise-backend
      APP_PORT: 18001
      DB_NAME: enterprise
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass default-mysql-client

      - name: Mask secrets
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "::add-mask::$DEPLOY_PASSWORD"
          echo "::add-mask::$DB_PASSWORD"

      - name: Collect remote service logs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SINCE: ${{ inputs.since }}
          GREP_PATTERN: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "${DEPLOY_PORT:-22}")
          sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "SERVICE='$DEPLOY_SERVICE' SINCE='$SINCE' GREP_PATTERN='$GREP_PATTERN' APP_PORT='$APP_PORT' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "--- service status"
          systemctl is-active "$SERVICE" || true
          echo "--- local health"
          curl -sS --max-time 10 "http://127.0.0.1:$APP_PORT/auth/code" | head -c 240 || true
          printf '\n'
          echo "--- matched journal lines"
          journalctl -u "$SERVICE" --since "$SINCE" --no-pager \
            | grep -E "$GREP_PATTERN" \
            | tail -240 || true
          echo "--- recent journal tail"
          journalctl -u "$SERVICE" --since "$SINCE" --no-pager | tail -120 || true
          REMOTE

      - name: Check enterprise database contract
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          mysql_args=(
            --connect-timeout=20
            --host="$DB_HOST"
            --port="$DB_PORT"
            --user="$DB_USERNAME"
            --password="$DB_PASSWORD"
            --default-character-set=utf8mb4
            --batch
            --skip-column-names
          )
          echo "--- key enterprise tables"
          mysql "${mysql_args[@]}" -e "
            select table_name
            from information_schema.tables
            where table_schema = '$DB_NAME'
              and table_name in (
                'ce_green_power_certificate',
                'ce_factor_confirmation',
                'ce_template_sheet',
                'ce_template_field',
                'sys_menu',
                'sys_role_menu'
              )
            order by table_name;
          "
          echo "--- green/factor menu rows"
          mysql "${mysql_args[@]}" "$DB_NAME" -e "
            select menu_id, menu_name, path, component, perms, status, visible
            from sys_menu
            where component like '%green%'
               or path like '%green%'
               or perms like '%green%'
               or perms like '%factorConfirmation%'
            order by menu_id;
          "
          echo "--- stale system green rows"
          mysql "${mysql_args[@]}" "$DB_NAME" -e "
            select menu_id, menu_name, path, component, perms, status, visible
            from sys_menu
            where component like 'system/green%'
               or path like '%greenElectricity%'
               or perms like 'system:greenElectricity:%'
            order by menu_id;
          "
