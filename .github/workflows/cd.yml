name: CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-enterprise-backend
  cancel-in-progress: true

env:
  DEPLOY_SERVICE: enterprise-backend
  APP_PORT: 18001
  SNAIL_PORT: 28081
  DB_NAME: enterprise
  DB_PREFIX: ENTERPRISE

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package
        run: mvn -B -Pprod clean package -DskipTests

      - name: Sync enterprise menu database from runner
        id: sync_menu_runner
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Menu database sync skipped because database secrets are incomplete."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          if timeout 60 mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < ruoyi-modules/ruoyi-system/src/main/resources/sql/enterprise_portal_menu_sync.sql; then
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              --batch \
              --skip-column-names \
              "$DB_NAME" \
              -e "select concat(repeat('  ', level - 1), menu_name) from (select p.menu_id, p.menu_name, p.order_num as parent_order, p.order_num, p.menu_id as parent_id, 1 as level from sys_menu p where p.parent_id = 0 and p.menu_type in ('M','C') and p.visible = '0' and p.status = '0' union all select c.menu_id, c.menu_name, p.order_num as parent_order, c.order_num, p.menu_id as parent_id, 2 as level from sys_menu p join sys_menu c on c.parent_id = p.menu_id where p.parent_id = 0 and p.menu_type in ('M','C') and p.visible = '0' and p.status = '0' and c.menu_type in ('M','C') and c.visible = '0' and c.status = '0') menu_snapshot order by parent_order, parent_id, level, order_num, menu_id;"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "Runner database sync did not complete; deploy step will retry from the target host."
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/fx' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASSWORD" ] || [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Deployment skipped because deploy or database secrets are incomplete."
            exit 0
          fi
          JAR_ARCHIVE="$RUNNER_TEMP/$DEPLOY_SERVICE-${GITHUB_RUN_ID}.jar.gz"
          JAR_ARCHIVE_SHA256="$RUNNER_TEMP/$DEPLOY_SERVICE-${GITHUB_RUN_ID}.jar.gz.sha256"
          CHUNK_PREFIX="$RUNNER_TEMP/part-"
          REMOTE_UPLOAD_DIR="$DEPLOY_PATH/uploads/$DEPLOY_SERVICE-${GITHUB_RUN_ID}"
          REMOTE_JAR_ARCHIVE="$REMOTE_UPLOAD_DIR/app.jar.gz"
          REMOTE_JAR_ARCHIVE_PART="$REMOTE_UPLOAD_DIR/app.jar.gz.part"
          REMOTE_JAR="$DEPLOY_PATH/$DEPLOY_SERVICE-${GITHUB_RUN_ID}.jar"
          sudo apt-get update
          sudo apt-get install -y sshpass gzip coreutils rsync
          gzip -9 -c ruoyi-admin/target/ruoyi-admin.jar > "$JAR_ARCHIVE"
          sha256sum "$JAR_ARCHIVE" | awk '{print $1}' > "$JAR_ARCHIVE_SHA256"
          SSH_OPTS=(
            -p "$DEPLOY_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          SCP_OPTS=(
            -P "$DEPLOY_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          RSYNC_RSH="ssh -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          SQL_FILE="ruoyi-modules/ruoyi-system/src/main/resources/sql/enterprise_portal_menu_sync.sql"
          REMOTE_SQL="$DEPLOY_PATH/enterprise_portal_menu_sync-${GITHUB_RUN_ID}.sql"
          cat > deploy-backend.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y openjdk-17-jre-headless redis-server gzip
          if [ ! -f "$REMOTE_JAR_ARCHIVE" ]; then
            cat "$REMOTE_UPLOAD_DIR"/part-* > "$REMOTE_JAR_ARCHIVE"
          fi
          printf '%s  %s\n' "$JAR_ARCHIVE_SHA256" "$REMOTE_JAR_ARCHIVE" | sha256sum -c -
          gzip -t "$REMOTE_JAR_ARCHIVE"
          gzip -dc "$REMOTE_JAR_ARCHIVE" > "$REMOTE_JAR"
          rm -rf "$REMOTE_UPLOAD_DIR"
          mv "$REMOTE_JAR" "$DEPLOY_PATH/apps/$DEPLOY_SERVICE/app.jar"
          echo "$SUDO_PASSWORD" | sudo -S sed -i "s/^# *requirepass .*/requirepass ruoyi123/; s/^requirepass .*/requirepass ruoyi123/" /etc/redis/redis.conf
          if ! echo "$SUDO_PASSWORD" | sudo -S grep -q '^requirepass ' /etc/redis/redis.conf; then
            echo "$SUDO_PASSWORD" | sudo -S sh -c "printf '\nrequirepass ruoyi123\n' >> /etc/redis/redis.conf"
          fi
          echo "$SUDO_PASSWORD" | sudo -S systemctl enable --now redis-server
          echo "$SUDO_PASSWORD" | sudo -S systemctl restart redis-server
          cat > "/tmp/$DEPLOY_SERVICE.service" <<SERVICE
          [Unit]
          Description=$DEPLOY_SERVICE
          After=network.target redis-server.service
          Wants=redis-server.service

          [Service]
          WorkingDirectory=$DEPLOY_PATH/apps/$DEPLOY_SERVICE
          Environment=TZ=Asia/Shanghai
          Environment=SERVER_PORT=$APP_PORT
          Environment=SNAIL_PORT=$SNAIL_PORT
          Environment=SPRING_DATA_REDIS_HOST=127.0.0.1
          Environment=SPRING_DATA_REDIS_PORT=6379
          Environment=SPRING_DATA_REDIS_PASSWORD=ruoyi123
          Environment=${DB_PREFIX}_DB_HOST=$DB_HOST
          Environment=${DB_PREFIX}_DB_PORT=$DB_PORT
          Environment=${DB_PREFIX}_DB_NAME=$DB_NAME
          Environment=${DB_PREFIX}_DB_USERNAME=$DB_USERNAME
          Environment=${DB_PREFIX}_DB_PASSWORD=$DB_PASSWORD
          Environment=ENTERPRISE_VENDOR_OPEN_BASE_URL=http://127.0.0.1:18000
          ExecStart=/usr/bin/java -Dserver.port=$APP_PORT -Dsnail-job.port=$SNAIL_PORT -jar app.jar
          Restart=always
          RestartSec=10
          User=$USER

          [Install]
          WantedBy=multi-user.target
          SERVICE
          echo "$SUDO_PASSWORD" | sudo -S mv "/tmp/$DEPLOY_SERVICE.service" "/etc/systemd/system/$DEPLOY_SERVICE.service"
          echo "$SUDO_PASSWORD" | sudo -S systemctl daemon-reload
          echo "$SUDO_PASSWORD" | sudo -S systemctl enable "$DEPLOY_SERVICE"
          echo "$SUDO_PASSWORD" | sudo -S systemctl restart "$DEPLOY_SERVICE"
          EOF
          cat > sync-menu-db.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y default-mysql-client
          mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < "$REMOTE_SQL"
          rm -f "$REMOTE_SQL"
          EOF
          timeout 60 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$REMOTE_UPLOAD_DIR' && mkdir -p '$DEPLOY_PATH' '$REMOTE_UPLOAD_DIR' '$DEPLOY_PATH/apps/$DEPLOY_SERVICE' '$DEPLOY_PATH/logs/$DEPLOY_SERVICE'"
          if [ "${{ steps.sync_menu_runner.outputs.status }}" != "success" ]; then
            timeout 60 sshpass -p "$DEPLOY_PASSWORD" scp "${SCP_OPTS[@]}" "$SQL_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_SQL"
            timeout 240 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' REMOTE_SQL='$REMOTE_SQL' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 180 bash -s" < sync-menu-db.sh
          fi
          upload_archive_with_ssh_stream() {
            for attempt in 1 2; do
              echo "Uploading backend archive via SSH stream (attempt $attempt/2)"
              if timeout 600 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$REMOTE_JAR_ARCHIVE'" < "$JAR_ARCHIVE"; then
                return 0
              fi
              sleep $((attempt * 10))
            done
            return 1
          }
          upload_archive_with_rsync() {
            for attempt in 1 2 3 4; do
              echo "Uploading backend archive via rsync (attempt $attempt/4)"
              if timeout 1200 sshpass -p "$DEPLOY_PASSWORD" rsync \
                --archive \
                --partial \
                --append-verify \
                --timeout=180 \
                --contimeout=20 \
                -e "$RSYNC_RSH" \
                "$JAR_ARCHIVE" \
                "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_JAR_ARCHIVE_PART"; then
                timeout 60 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mv '$REMOTE_JAR_ARCHIVE_PART' '$REMOTE_JAR_ARCHIVE'"
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          upload_archive_with_chunks() {
            echo "Rsync upload failed; falling back to 256KB chunked upload."
            rm -f "$RUNNER_TEMP"/part-*
            split -b 256k -d -a 5 "$JAR_ARCHIVE" "$CHUNK_PREFIX"
            timeout 60 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f '$REMOTE_JAR_ARCHIVE_PART' '$REMOTE_JAR_ARCHIVE' '$REMOTE_UPLOAD_DIR'/part-*"
            for chunk in "$RUNNER_TEMP"/part-*; do
              chunk_name="$(basename "$chunk")"
              uploaded=0
              for attempt in 1 2 3 4 5 6 7 8; do
                echo "Uploading $chunk_name (attempt $attempt/8)"
                if timeout 180 sshpass -p "$DEPLOY_PASSWORD" scp -l 512 "${SCP_OPTS[@]}" "$chunk" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_UPLOAD_DIR/$chunk_name"; then
                  uploaded=1
                  break
                fi
                sleep $((attempt * 5))
              done
              if [ "$uploaded" -ne 1 ]; then
                echo "Failed to upload $chunk_name after retries."
                return 1
              fi
            done
          }
          upload_archive_with_rsync || upload_archive_with_ssh_stream || upload_archive_with_chunks
          timeout 1800 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "REMOTE_UPLOAD_DIR='$REMOTE_UPLOAD_DIR' REMOTE_JAR_ARCHIVE='$REMOTE_JAR_ARCHIVE' JAR_ARCHIVE_SHA256='$(cat "$JAR_ARCHIVE_SHA256")' GITHUB_RUN_ID='$GITHUB_RUN_ID' DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SERVICE='$DEPLOY_SERVICE' APP_PORT='$APP_PORT' SNAIL_PORT='$SNAIL_PORT' DB_PREFIX='$DB_PREFIX' DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' REMOTE_JAR='$REMOTE_JAR' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 1700 bash -s" < deploy-backend.sh
