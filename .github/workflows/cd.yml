name: CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-enterprise-backend
  cancel-in-progress: true

env:
  DEPLOY_SERVICE: enterprise-backend
  APP_PORT: 18001
  SNAIL_PORT: 28081
  DB_NAME: enterprise
  DB_PREFIX: ENTERPRISE

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package
        run: mvn -B -Pprod -pl ruoyi-admin -am clean package -DskipTests

      - name: Sync enterprise business database from runner
        id: sync_business_runner
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Enterprise business database sync skipped because database secrets are incomplete."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < script/sql/mysql/carbon_enterprise_schema_v1.sql
          template_count="$(mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            --batch \
            --skip-column-names \
            "$DB_NAME" \
            -e "select count(*) from ce_template_version;")"
          if [ "${template_count:-0}" = "0" ]; then
            echo "Enterprise template inventory is empty; loading template seed."
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              "$DB_NAME" \
              < script/sql/mysql/carbon_enterprise_template_seed_v1.sql
          else
            echo "Enterprise template inventory already has $template_count row(s); skipping destructive template seed."
          fi
          mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            --batch \
            --skip-column-names \
            "$DB_NAME" \
            -e "select count(*) from information_schema.tables where table_schema = '$DB_NAME' and table_name like 'ce\\_%';"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Sync enterprise menu database from runner
        id: sync_menu_runner
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Menu database sync skipped because database secrets are incomplete."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          if timeout 60 mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < ruoyi-modules/ruoyi-system/src/main/resources/sql/enterprise_portal_menu_sync.sql; then
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              --batch \
              --skip-column-names \
              "$DB_NAME" \
              -e "select concat(repeat('  ', level - 1), menu_name) from (select p.menu_id, p.menu_name, p.order_num as parent_order, p.order_num, p.menu_id as parent_id, 1 as level from sys_menu p where p.parent_id = 0 and p.menu_type in ('M','C') and p.visible = '0' and p.status = '0' union all select c.menu_id, c.menu_name, p.order_num as parent_order, c.order_num, p.menu_id as parent_id, 2 as level from sys_menu p join sys_menu c on c.parent_id = p.menu_id where p.parent_id = 0 and p.menu_type in ('M','C') and p.visible = '0' and p.status = '0' and c.menu_type in ('M','C') and c.visible = '0' and c.status = '0') menu_snapshot order by parent_order, parent_id, level, order_num, menu_id;"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "Runner database sync did not complete; deploy step will retry from the target host."
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/fx' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASSWORD" ] || [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Deployment skipped because deploy or database secrets are incomplete."
            exit 0
          fi
          LOCAL_APP_JAR="ruoyi-admin/target/ruoyi-admin.jar"
          REMOTE_APP_JAR="/tmp/$DEPLOY_SERVICE-${GITHUB_RUN_ID}.jar"
          ENTERPRISE_SCHEMA_FILE="script/sql/mysql/carbon_enterprise_schema_v1.sql"
          ENTERPRISE_TEMPLATE_SEED_FILE="script/sql/mysql/carbon_enterprise_template_seed_v1.sql"
          sudo apt-get update
          sudo apt-get install -y sshpass rsync
          SSH_OPTS=(
            -p "$DEPLOY_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=8
          )
          RSYNC_RSH="ssh -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          SCP_OPTS=(
            -P "$DEPLOY_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=8
          )
          SQL_FILE="ruoyi-modules/ruoyi-system/src/main/resources/sql/enterprise_portal_menu_sync.sql"
          REMOTE_SQL="/tmp/enterprise_portal_menu_sync-${GITHUB_RUN_ID}.sql"
          REMOTE_SCHEMA="/tmp/carbon_enterprise_schema_v1-${GITHUB_RUN_ID}.sql"
          REMOTE_TEMPLATE_SEED="/tmp/carbon_enterprise_template_seed_v1-${GITHUB_RUN_ID}.sql"
          cat > deploy-backend.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y openjdk-17-jdk-headless redis-server curl
          echo "$SUDO_PASSWORD" | sudo -S install -d -o "$USER" -g "$USER" "$DEPLOY_PATH/apps/$DEPLOY_SERVICE" "$DEPLOY_PATH/logs/$DEPLOY_SERVICE"
          install -m 0644 "$REMOTE_APP_JAR" "$DEPLOY_PATH/apps/$DEPLOY_SERVICE/app.jar"
          rm -f "$REMOTE_APP_JAR"
          echo "$SUDO_PASSWORD" | sudo -S sed -i "s/^# *requirepass .*/requirepass ruoyi123/; s/^requirepass .*/requirepass ruoyi123/" /etc/redis/redis.conf
          if ! echo "$SUDO_PASSWORD" | sudo -S grep -q '^requirepass ' /etc/redis/redis.conf; then
            echo "$SUDO_PASSWORD" | sudo -S sh -c "printf '\nrequirepass ruoyi123\n' >> /etc/redis/redis.conf"
          fi
          echo "$SUDO_PASSWORD" | sudo -S systemctl enable --now redis-server
          echo "$SUDO_PASSWORD" | sudo -S systemctl restart redis-server
          cat > "/tmp/$DEPLOY_SERVICE.service" <<SERVICE
          [Unit]
          Description=$DEPLOY_SERVICE
          After=network.target redis-server.service
          Wants=redis-server.service

          [Service]
          WorkingDirectory=$DEPLOY_PATH/apps/$DEPLOY_SERVICE
          Environment=TZ=Asia/Shanghai
          Environment=SERVER_PORT=$APP_PORT
          Environment=SNAIL_PORT=$SNAIL_PORT
          Environment=SPRING_DATA_REDIS_HOST=127.0.0.1
          Environment=SPRING_DATA_REDIS_PORT=6379
          Environment=SPRING_DATA_REDIS_PASSWORD=ruoyi123
          Environment=${DB_PREFIX}_DB_HOST=$DB_HOST
          Environment=${DB_PREFIX}_DB_PORT=$DB_PORT
          Environment=${DB_PREFIX}_DB_NAME=$DB_NAME
          Environment=${DB_PREFIX}_DB_USERNAME=$DB_USERNAME
          Environment=${DB_PREFIX}_DB_PASSWORD=$DB_PASSWORD
          Environment=ENTERPRISE_VENDOR_OPEN_BASE_URL=http://127.0.0.1:18000
          ExecStart=/usr/bin/java -Dserver.port=$APP_PORT -Dsnail-job.port=$SNAIL_PORT -jar app.jar
          Restart=always
          RestartSec=10
          TimeoutStopSec=30
          KillMode=mixed
          KillSignal=SIGTERM
          SuccessExitStatus=143
          User=$USER

          [Install]
          WantedBy=multi-user.target
          SERVICE
          echo "$SUDO_PASSWORD" | sudo -S mv "/tmp/$DEPLOY_SERVICE.service" "/etc/systemd/system/$DEPLOY_SERVICE.service"
          echo "$SUDO_PASSWORD" | sudo -S systemctl daemon-reload
          echo "$SUDO_PASSWORD" | sudo -S systemctl enable "$DEPLOY_SERVICE"
          echo "$SUDO_PASSWORD" | sudo -S systemctl restart "$DEPLOY_SERVICE"
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$APP_PORT/auth/code" | grep -q '"code":200'; then
              echo "$DEPLOY_SERVICE is healthy on 127.0.0.1:$APP_PORT"
              exit 0
            fi
            sleep 5
          done
          echo "$DEPLOY_SERVICE did not become healthy on 127.0.0.1:$APP_PORT" >&2
          echo "$SUDO_PASSWORD" | sudo -S systemctl status "$DEPLOY_SERVICE" --no-pager -l || true
          echo "$SUDO_PASSWORD" | sudo -S journalctl -u "$DEPLOY_SERVICE" -n 160 --no-pager || true
          ss -lntp || true
          exit 1
          EOF
          cat > sync-business-db.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y default-mysql-client
          mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < "$REMOTE_SCHEMA"
          template_count="$(mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            --batch \
            --skip-column-names \
            "$DB_NAME" \
            -e "select count(*) from ce_template_version;")"
          if [ "${template_count:-0}" = "0" ]; then
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              "$DB_NAME" \
              < "$REMOTE_TEMPLATE_SEED"
          fi
          rm -f "$REMOTE_SCHEMA" "$REMOTE_TEMPLATE_SEED"
          EOF
          cat > sync-menu-db.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y default-mysql-client
          mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < "$REMOTE_SQL"
          rm -f "$REMOTE_SQL"
          EOF
          cat > install-transfer-tools.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y rsync
          if [ -f "$DEPLOY_PATH/apps/$DEPLOY_SERVICE/app.jar" ]; then
            cp "$DEPLOY_PATH/apps/$DEPLOY_SERVICE/app.jar" "$REMOTE_APP_JAR"
            echo "Seeded remote transfer target from current deployment:"
            ls -lh "$REMOTE_APP_JAR"
          else
            echo "No current deployment jar found; rsync will upload the full jar."
          fi
          EOF
          if [ "${{ steps.sync_business_runner.outputs.status }}" != "success" ]; then
            timeout 60 sshpass -p "$DEPLOY_PASSWORD" scp "${SCP_OPTS[@]}" "$ENTERPRISE_SCHEMA_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_SCHEMA"
            timeout 60 sshpass -p "$DEPLOY_PASSWORD" scp "${SCP_OPTS[@]}" "$ENTERPRISE_TEMPLATE_SEED_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_TEMPLATE_SEED"
            timeout 300 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' REMOTE_SCHEMA='$REMOTE_SCHEMA' REMOTE_TEMPLATE_SEED='$REMOTE_TEMPLATE_SEED' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 240 bash -s" < sync-business-db.sh
          fi
          if [ "${{ steps.sync_menu_runner.outputs.status }}" != "success" ]; then
            timeout 60 sshpass -p "$DEPLOY_PASSWORD" scp "${SCP_OPTS[@]}" "$SQL_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_SQL"
            timeout 240 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' REMOTE_SQL='$REMOTE_SQL' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 180 bash -s" < sync-menu-db.sh
          fi
          jar_size="$(du -h "$LOCAL_APP_JAR" | cut -f1)"
          echo "Uploading application jar ($jar_size) to $DEPLOY_HOST:$REMOTE_APP_JAR"
          timeout 300 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SERVICE='$DEPLOY_SERVICE' REMOTE_APP_JAR='$REMOTE_APP_JAR' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 240 bash -s" < install-transfer-tools.sh
          if timeout 1200 sshpass -p "$DEPLOY_PASSWORD" rsync -av --partial --inplace --info=progress2 \
            -e "$RSYNC_RSH" "$LOCAL_APP_JAR" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_APP_JAR"; then
            echo "Application jar uploaded with rsync."
          else
            echo "Rsync upload failed or timed out; retrying direct SSH stream upload."
            timeout 1800 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$REMOTE_APP_JAR'" < "$LOCAL_APP_JAR"
          fi
          timeout 900 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SERVICE='$DEPLOY_SERVICE' APP_PORT='$APP_PORT' SNAIL_PORT='$SNAIL_PORT' DB_PREFIX='$DB_PREFIX' DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' REMOTE_APP_JAR='$REMOTE_APP_JAR' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 840 bash -s" < deploy-backend.sh
