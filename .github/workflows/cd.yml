name: CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-enterprise-backend
  cancel-in-progress: true

env:
  DEPLOY_SERVICE: enterprise-backend
  APP_PORT: 18001
  SNAIL_PORT: 28081
  DB_NAME: enterprise
  DB_PREFIX: ENTERPRISE

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync enterprise business database from runner
        id: sync_business_runner
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Enterprise business database sync skipped because database secrets are incomplete."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < script/sql/mysql/carbon_enterprise_schema_v1.sql
          template_count="$(mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            --batch \
            --skip-column-names \
            "$DB_NAME" \
            -e "select count(*) from ce_template_version;")"
          if [ "${template_count:-0}" = "0" ]; then
            echo "Enterprise template inventory is empty; loading template seed."
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              "$DB_NAME" \
              < script/sql/mysql/carbon_enterprise_template_seed_v1.sql
          else
            echo "Enterprise template inventory already has $template_count row(s); skipping destructive template seed."
          fi
          mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            --batch \
            --skip-column-names \
            "$DB_NAME" \
            -e "select count(*) from information_schema.tables where table_schema = '$DB_NAME' and table_name like 'ce\\_%';"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Sync enterprise menu database from runner
        id: sync_menu_runner
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Menu database sync skipped because database secrets are incomplete."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          if timeout 60 mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < ruoyi-modules/ruoyi-system/src/main/resources/sql/enterprise_portal_menu_sync.sql; then
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              --batch \
              --skip-column-names \
              "$DB_NAME" \
              -e "select concat(repeat('  ', level - 1), menu_name) from (select p.menu_id, p.menu_name, p.order_num as parent_order, p.order_num, p.menu_id as parent_id, 1 as level from sys_menu p where p.parent_id = 0 and p.menu_type in ('M','C') and p.visible = '0' and p.status = '0' union all select c.menu_id, c.menu_name, p.order_num as parent_order, c.order_num, p.menu_id as parent_id, 2 as level from sys_menu p join sys_menu c on c.parent_id = p.menu_id where p.parent_id = 0 and p.menu_type in ('M','C') and p.visible = '0' and p.status = '0' and c.menu_type in ('M','C') and c.visible = '0' and c.status = '0') menu_snapshot order by parent_order, parent_id, level, order_num, menu_id;"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "Runner database sync did not complete; deploy step will retry from the target host."
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/fx' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASSWORD" ] || [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Deployment skipped because deploy or database secrets are incomplete."
            exit 0
          fi
          SOURCE_ARCHIVE="$RUNNER_TEMP/$DEPLOY_SERVICE-${GITHUB_RUN_ID}-source.tar.gz"
          REMOTE_UPLOAD_DIR="$DEPLOY_PATH/uploads/$DEPLOY_SERVICE-${GITHUB_RUN_ID}"
          REMOTE_SOURCE_ARCHIVE="$REMOTE_UPLOAD_DIR/source.tar.gz"
          REMOTE_BUILD_DIR="$DEPLOY_PATH/builds/$DEPLOY_SERVICE-${GITHUB_RUN_ID}"
          ENTERPRISE_SCHEMA_FILE="script/sql/mysql/carbon_enterprise_schema_v1.sql"
          ENTERPRISE_TEMPLATE_SEED_FILE="script/sql/mysql/carbon_enterprise_template_seed_v1.sql"
          sudo apt-get update
          sudo apt-get install -y sshpass gzip tar coreutils
          tar \
            --exclude='.git' \
            --exclude='**/target' \
            --exclude='**/node_modules' \
            --exclude='**/.mvn/wrapper/maven-wrapper.jar' \
            -czf "$SOURCE_ARCHIVE" .
          SSH_OPTS=(
            -p "$DEPLOY_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          SCP_OPTS=(
            -P "$DEPLOY_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          SQL_FILE="ruoyi-modules/ruoyi-system/src/main/resources/sql/enterprise_portal_menu_sync.sql"
          REMOTE_SQL="$DEPLOY_PATH/enterprise_portal_menu_sync-${GITHUB_RUN_ID}.sql"
          REMOTE_SCHEMA="$DEPLOY_PATH/carbon_enterprise_schema_v1-${GITHUB_RUN_ID}.sql"
          REMOTE_TEMPLATE_SEED="$DEPLOY_PATH/carbon_enterprise_template_seed_v1-${GITHUB_RUN_ID}.sql"
          cat > deploy-backend.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y openjdk-17-jdk-headless maven redis-server gzip tar
          rm -rf "$REMOTE_BUILD_DIR"
          mkdir -p "$REMOTE_BUILD_DIR"
          tar -xzf "$REMOTE_SOURCE_ARCHIVE" -C "$REMOTE_BUILD_DIR"
          cd "$REMOTE_BUILD_DIR"
          mvn -B -Pprod clean package -DskipTests
          install -m 0644 ruoyi-admin/target/ruoyi-admin.jar "$DEPLOY_PATH/apps/$DEPLOY_SERVICE/app.jar"
          rm -rf "$REMOTE_UPLOAD_DIR" "$REMOTE_BUILD_DIR"
          echo "$SUDO_PASSWORD" | sudo -S sed -i "s/^# *requirepass .*/requirepass ruoyi123/; s/^requirepass .*/requirepass ruoyi123/" /etc/redis/redis.conf
          if ! echo "$SUDO_PASSWORD" | sudo -S grep -q '^requirepass ' /etc/redis/redis.conf; then
            echo "$SUDO_PASSWORD" | sudo -S sh -c "printf '\nrequirepass ruoyi123\n' >> /etc/redis/redis.conf"
          fi
          echo "$SUDO_PASSWORD" | sudo -S systemctl enable --now redis-server
          echo "$SUDO_PASSWORD" | sudo -S systemctl restart redis-server
          cat > "/tmp/$DEPLOY_SERVICE.service" <<SERVICE
          [Unit]
          Description=$DEPLOY_SERVICE
          After=network.target redis-server.service
          Wants=redis-server.service

          [Service]
          WorkingDirectory=$DEPLOY_PATH/apps/$DEPLOY_SERVICE
          Environment=TZ=Asia/Shanghai
          Environment=SERVER_PORT=$APP_PORT
          Environment=SNAIL_PORT=$SNAIL_PORT
          Environment=SPRING_DATA_REDIS_HOST=127.0.0.1
          Environment=SPRING_DATA_REDIS_PORT=6379
          Environment=SPRING_DATA_REDIS_PASSWORD=ruoyi123
          Environment=${DB_PREFIX}_DB_HOST=$DB_HOST
          Environment=${DB_PREFIX}_DB_PORT=$DB_PORT
          Environment=${DB_PREFIX}_DB_NAME=$DB_NAME
          Environment=${DB_PREFIX}_DB_USERNAME=$DB_USERNAME
          Environment=${DB_PREFIX}_DB_PASSWORD=$DB_PASSWORD
          Environment=ENTERPRISE_VENDOR_OPEN_BASE_URL=http://127.0.0.1:18000
          ExecStart=/usr/bin/java -Dserver.port=$APP_PORT -Dsnail-job.port=$SNAIL_PORT -jar app.jar
          Restart=always
          RestartSec=10
          User=$USER

          [Install]
          WantedBy=multi-user.target
          SERVICE
          echo "$SUDO_PASSWORD" | sudo -S mv "/tmp/$DEPLOY_SERVICE.service" "/etc/systemd/system/$DEPLOY_SERVICE.service"
          echo "$SUDO_PASSWORD" | sudo -S systemctl daemon-reload
          echo "$SUDO_PASSWORD" | sudo -S systemctl enable "$DEPLOY_SERVICE"
          echo "$SUDO_PASSWORD" | sudo -S systemctl restart "$DEPLOY_SERVICE"
          EOF
          cat > sync-business-db.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y default-mysql-client
          mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < "$REMOTE_SCHEMA"
          template_count="$(mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            --batch \
            --skip-column-names \
            "$DB_NAME" \
            -e "select count(*) from ce_template_version;")"
          if [ "${template_count:-0}" = "0" ]; then
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              "$DB_NAME" \
              < "$REMOTE_TEMPLATE_SEED"
          fi
          rm -f "$REMOTE_SCHEMA" "$REMOTE_TEMPLATE_SEED"
          EOF
          cat > sync-menu-db.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y default-mysql-client
          mysql \
            --connect-timeout=20 \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USERNAME" \
            --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 \
            "$DB_NAME" \
            < "$REMOTE_SQL"
          rm -f "$REMOTE_SQL"
          EOF
          timeout 60 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$REMOTE_UPLOAD_DIR' && mkdir -p '$DEPLOY_PATH' '$REMOTE_UPLOAD_DIR' '$DEPLOY_PATH/apps/$DEPLOY_SERVICE' '$DEPLOY_PATH/logs/$DEPLOY_SERVICE'"
          if [ "${{ steps.sync_business_runner.outputs.status }}" != "success" ]; then
            timeout 60 sshpass -p "$DEPLOY_PASSWORD" scp "${SCP_OPTS[@]}" "$ENTERPRISE_SCHEMA_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_SCHEMA"
            timeout 60 sshpass -p "$DEPLOY_PASSWORD" scp "${SCP_OPTS[@]}" "$ENTERPRISE_TEMPLATE_SEED_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_TEMPLATE_SEED"
            timeout 300 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' REMOTE_SCHEMA='$REMOTE_SCHEMA' REMOTE_TEMPLATE_SEED='$REMOTE_TEMPLATE_SEED' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 240 bash -s" < sync-business-db.sh
          fi
          if [ "${{ steps.sync_menu_runner.outputs.status }}" != "success" ]; then
            timeout 60 sshpass -p "$DEPLOY_PASSWORD" scp "${SCP_OPTS[@]}" "$SQL_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_SQL"
            timeout 240 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' REMOTE_SQL='$REMOTE_SQL' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 180 bash -s" < sync-menu-db.sh
          fi
          timeout 180 sshpass -p "$DEPLOY_PASSWORD" scp "${SCP_OPTS[@]}" "$SOURCE_ARCHIVE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_SOURCE_ARCHIVE"
          timeout 1800 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "REMOTE_UPLOAD_DIR='$REMOTE_UPLOAD_DIR' REMOTE_SOURCE_ARCHIVE='$REMOTE_SOURCE_ARCHIVE' REMOTE_BUILD_DIR='$REMOTE_BUILD_DIR' DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SERVICE='$DEPLOY_SERVICE' APP_PORT='$APP_PORT' SNAIL_PORT='$SNAIL_PORT' DB_PREFIX='$DB_PREFIX' DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 1700 bash -s" < deploy-backend.sh
