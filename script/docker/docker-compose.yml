services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: enterprise-sqlserver
    environment:
      TZ: Asia/Shanghai
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Enterprise@12345}"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - /docker/sqlserver/data:/var/opt/mssql
    restart: unless-stopped

  redis:
    image: redis:7.2.8
    container_name: enterprise-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - /docker/redis/conf:/redis/config:rw
      - /docker/redis/data:/redis/data:rw
    command: "redis-server /redis/config/redis.conf"
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-02-14T12-00-00Z
    container_name: enterprise-minio
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-carbon}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-carbon123}"
      MINIO_COMPRESS: "off"
      MINIO_COMPRESS_EXTENSIONS: ""
      MINIO_COMPRESS_MIME_TYPES: ""
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /docker/minio/data:/data
      - /docker/minio/config:/root/.minio
    command: server --address ':9000' --console-address ':9001' /data
    restart: unless-stopped

  nginx-web:
    image: nginx:1.27-alpine
    container_name: enterprise-nginx-web
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /docker/nginx/cert:/etc/nginx/cert
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - /docker/nginx/html:/usr/share/nginx/html
      - /docker/nginx/log:/var/log/nginx
    restart: unless-stopped
