services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: enterprise-sqlserver
    environment:
      TZ: Asia/Shanghai
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Enterprise@12345}"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - /docker/sqlserver/data:/var/opt/mssql
    restart: unless-stopped
