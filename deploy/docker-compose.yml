services:
  enterprise-redis:
    image: redis:7.4-alpine
    container_name: fx-enterprise-redis
    restart: unless-stopped
    command: >
      sh -lc 'if [ -n "$${ENTERPRISE_REDIS_PASSWORD:-}" ]; then
        exec redis-server --appendonly yes --requirepass "$${ENTERPRISE_REDIS_PASSWORD}";
      else
        exec redis-server --appendonly yes;
      fi'
    environment:
      ENTERPRISE_REDIS_PASSWORD: ${ENTERPRISE_REDIS_PASSWORD:-}
    volumes:
      - ./data/redis:/data
    networks:
      - fx

  enterprise-backend:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/enterprise-backend:${IMAGE_TAG}
    container_name: fx-enterprise-backend
    restart: unless-stopped
    depends_on:
      - enterprise-redis
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      SNAIL_PORT: 28080
      ENTERPRISE_DB_URL: ${ENTERPRISE_DB_URL:?ENTERPRISE_DB_URL is required}
      ENTERPRISE_DB_USERNAME: ${ENTERPRISE_DB_USERNAME:?ENTERPRISE_DB_USERNAME is required}
      ENTERPRISE_DB_PASSWORD: ${ENTERPRISE_DB_PASSWORD:?ENTERPRISE_DB_PASSWORD is required}
      ENTERPRISE_REDIS_HOST: ${ENTERPRISE_REDIS_HOST:-enterprise-redis}
      ENTERPRISE_REDIS_PORT: ${ENTERPRISE_REDIS_PORT:-6379}
      ENTERPRISE_REDIS_PASSWORD: ${ENTERPRISE_REDIS_PASSWORD:-}
      ENTERPRISE_VENDOR_OPEN_BASE_URL: ${ENTERPRISE_VENDOR_OPEN_BASE_URL:-http://vendor-backend:8080}
      JAVA_OPTS: ${ENTERPRISE_BACKEND_JAVA_OPTS:-}
    ports:
      - "${ENTERPRISE_BACKEND_PORT:-18001}:8080"
      - "${ENTERPRISE_SNAIL_PORT:-28081}:28080"
    volumes:
      - ./logs/enterprise-backend:/ruoyi/server/logs
    networks:
      - fx

networks:
  fx:
    name: ${FX_DOCKER_NETWORK:-fx-delivery}
    driver: bridge
